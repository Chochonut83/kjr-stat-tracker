<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2350">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KJR Stats">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<title>Kitchener Jr Rangers Stat Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: the whole app sits on an overhead rink; opponent owns the left half, Rangers the right, split by the red line. Single committed look (ice), same in light and dark. */
:root{
  --ice:#f1f6fa; --ice-2:#dfe9f1; --ink:#0d1b33; --ink-2:#4a5b74;
  --navy:#123a7a; --navy-deep:#0b2350; --red:#d3212c; --red-deep:#a4161f;
  --amber:#f4b223; --line:#c8d5e0; --sheet:#ffffff; --muted:#eef2f6;
  --opp:#2b2f37; --good:#178a4c;
  --f-display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ice);color:var(--ink);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
input{font:inherit;color:var(--ink)}
#ice{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.screen{position:relative;z-index:1;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* setup screens */
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:54px;height:auto}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em;color:var(--navy-deep)}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-top:4px}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--navy)}
.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 24px rgba(13,27,51,.08)}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;margin:0;color:var(--ink);text-wrap:balance;line-height:1.05}
.hint{color:var(--ink-2);margin:0;font-size:14px}
.teams{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:560px){.teams{grid-template-columns:repeat(4,1fr)}}
.tbtn{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:118px}
.tbtn img{height:62px;width:100%;object-fit:contain}
.tbtn span{font-size:12px;font-weight:600;line-height:1.15;text-align:center}
.tbtn.sel{border-color:var(--red);box-shadow:0 0 0 3px rgba(211,33,44,.18)}
.badge{width:62px;height:62px;border-radius:50%;background:var(--opp);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:24px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.field label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.field input{border:2px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;width:100%;font-size:16px}
.field input.err{border-color:var(--red)}
.btn{border-radius:12px;padding:14px 18px;font-weight:700;font-size:16px;text-align:center}
.btn-primary{background:var(--red);color:#fff}
.btn-navy{background:var(--navy);color:#fff}
.btn-ghost{background:#fff;border:2px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-big{font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.04em;padding:16px}
.goalies{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gbtn{background:#fff;border:2px solid var(--line);border-radius:12px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.gbtn b{font-family:var(--f-display);font-size:40px;line-height:1;color:var(--navy)}
.gbtn span{font-weight:600}
.gbtn.sel{border-color:var(--red);box-shadow:0 0 0 3px rgba(211,33,44,.18)}
.roster{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.rrow{display:grid;grid-template-columns:48px 1fr auto auto;gap:10px;align-items:center;padding:9px 10px 9px 12px;border-top:1px solid var(--muted)}
.rrow:first-child{border-top:0}
.rrow .num{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums}
.rrow .nm{font-weight:600;min-width:0}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--muted);color:var(--ink-2)}
.tag.g{background:#fde9b8;color:#6b4a00}
.xbtn{width:36px;height:36px;border-radius:8px;background:var(--muted);color:var(--red-deep);font-size:20px;font-weight:700;line-height:1}
.resume{background:var(--navy-deep);color:#fff;border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.resume p{margin:0;font-weight:600}
.lens{display:flex;flex-direction:column;gap:8px}
.lenrow{display:grid;grid-template-columns:1fr 44px 64px auto 44px;gap:8px;align-items:center}
.lname{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase}
.step{height:44px;border-radius:10px;background:var(--navy);color:#fff;font-size:24px;font-weight:700;line-height:1}
.lenin{height:44px;width:100%;text-align:center;border:2px solid var(--line);border-radius:10px;font-family:var(--f-display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.lmin{font-size:13px;font-weight:600;color:var(--ink-2)}
.hlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.hitem{display:flex;align-items:stretch;border-top:1px solid var(--muted)}
.hitem:first-child{border-top:0}
.hrow{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:10px 12px;text-align:left;flex:1;min-width:0}
.hdelbtn{background:var(--red);color:#fff;font-weight:700;font-size:14px;padding:0 14px;min-width:76px}
.hrow:active{background:var(--muted)}
.hlogo{width:48px;height:40px;object-fit:contain}
.hlogo.badge{width:40px;height:40px;font-size:16px}
.hmid{display:flex;flex-direction:column;gap:2px;min-width:0}
.hmid b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmid small{font-size:12px;color:var(--ink-2);font-weight:500}
.hres{font-family:var(--f-display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.hres i{font-style:normal;font-size:13px;letter-spacing:.04em;padding:3px 7px;border-radius:6px;background:var(--muted);color:var(--ink-2)}
.hres.win i{background:var(--good);color:#fff}
.hres.loss i{background:var(--red);color:#fff}
.srec{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.srec div{background:var(--muted);border-radius:10px;padding:10px 4px;text-align:center}
.srec b{display:block;font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;color:var(--navy-deep);font-variant-numeric:tabular-nums}
.srec small{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink-2)}
.stbl-season{min-width:600px}
.sortb{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--ink-2);padding:4px 2px;border-radius:5px}
.sortb.on{background:var(--navy);color:#fff;padding:4px 6px}
.pickrow{display:grid;grid-template-columns:1fr;gap:8px}
.pick{display:flex;align-items:center;gap:12px;border:2px dashed var(--line);border-radius:12px;padding:10px;background:#fff;cursor:pointer}
.pick b{display:block}
.pick small{display:block;font-size:12px;color:var(--ink-2);word-break:break-all}
.pk-prev{width:56px;height:56px;flex:0 0 56px;border-radius:8px;background:var(--muted);display:grid;place-items:center;font-size:24px;color:var(--navy);overflow:hidden}
.pk-prev img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:8px;overflow-x:auto}
.thumbs img{height:120px;width:auto;border-radius:8px;border:1px solid var(--line)}
.rin{border:2px solid var(--line);border-radius:8px;padding:7px 6px;text-align:center;font-size:16px;background:#fff;max-width:100%}
.rin.nm{text-align:left;width:140px}
.rtbl th,.rtbl td{padding:5px 3px}
.rtbl{min-width:max-content}
.upphotos{display:flex;flex-direction:column;gap:12px}
.upphotos figure{margin:0;display:flex;flex-direction:column;gap:4px}
.upphotos img{width:100%;border-radius:10px;border:1px solid var(--line)}
.upphotos figcaption{font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.teambar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.teambar span{display:flex;flex-direction:column;gap:2px;min-width:0}
.teambar small{font-size:12px;color:var(--ink-2);font-weight:600}
.livecard{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.livecard.on{border-color:var(--red);box-shadow:0 0 0 3px rgba(211,33,44,.12)}
.livecard div{display:flex;flex-direction:column;gap:3px;min-width:0}
.livecard small{font-size:13px;color:var(--ink-2);font-weight:600}
.livecard.on b{color:var(--red-deep)}
.watchbar{display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
.watchbar .wtxt{min-width:0}
.watchbar .dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:0 0 10px;animation:pulse 1.6s infinite}
.watchbar.stale .dot{background:var(--amber);animation:none}
@keyframes pulse{50%{opacity:.35}}
.gfoot.one{grid-template-columns:1fr}
.seg{display:flex;background:var(--muted);border-radius:10px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:8px;font-weight:700;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--navy);color:#fff}

/* game */
#game{display:flex;flex-direction:column;height:100%;min-height:0;padding-block:8px 10px;gap:8px}
.gbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.per{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--amber);padding:5px 16px;border-radius:8px;font-variant-numeric:tabular-nums}
.gbar .r{justify-self:end}
.minibtn{font-size:13px;font-weight:700;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.85);border:1px solid var(--line);color:var(--ink-2)}
.halves{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.team{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.team .logo{height:clamp(56px,12vh,96px);width:90%;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(13,27,51,.18))}
.team .logo.badge{width:clamp(56px,12vh,96px);font-size:28px}
.team .tname{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:center;line-height:1.15;color:var(--ink);min-height:2.3em;display:flex;align-items:center}
.score{font-family:var(--f-display);font-weight:800;font-size:clamp(56px,11vh,92px);line-height:.9;color:var(--ink);font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #fff,0 0 12px #fff}
.home .score{color:var(--navy-deep)}
.mini{display:flex;gap:6px;width:100%}
.mini div{flex:1;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:9px;padding:4px 2px;text-align:center}
.mini b{display:block;font-family:var(--f-display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.mini small{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--ink-2)}
.gpill{width:100%;display:flex;flex-direction:column;align-items:center;gap:1px;background:#fff;border:2px solid var(--navy);color:var(--navy-deep);border-radius:10px;padding:5px 4px;min-height:44px;justify-content:center}
.gpill span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl1{font-size:11px;font-weight:600;color:var(--ink-2)}
.gl2{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.gpill:active{background:var(--muted)}
.gpill.ph{visibility:hidden}
.acts{display:flex;flex-direction:column;gap:9px;width:100%;margin-top:auto}
.act{border-radius:14px;font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:21px;padding:0 6px;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 3px 0 rgba(0,0,0,.22);transition:transform .06s}
.act:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.act.shot{height:clamp(64px,11.5vh,96px);font-size:26px;color:#fff}
.opp .act.shot{background:var(--opp)}
.home .act.shot{background:var(--navy)}
.act.goal{height:clamp(50px,8vh,66px);background:var(--red);color:#fff}
.act.pen{height:clamp(46px,7vh,58px);background:var(--amber);color:var(--ink)}
.act.fo{height:clamp(46px,7vh,58px);background:#fff;color:var(--navy-deep);border:2px solid var(--navy-deep);font-size:18px}
.lastact{text-align:center;font-size:13px;font-weight:600;color:var(--ink-2);min-height:1.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(255,255,255,.8);border-radius:8px;padding:4px 8px}
.gfoot{display:grid;grid-template-columns:auto 1fr;gap:10px}
.gfoot .btn{padding:14px 16px}
.undo{background:#fff;border:2px solid var(--ink);color:var(--ink);display:flex;align-items:center;gap:8px}
.undo:disabled{opacity:.35}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(9,18,34,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);width:100%;max-width:640px;max-height:92%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px solid var(--muted)}
.sh-head h3{margin:0;font-family:var(--f-display);font-size:24px;text-transform:uppercase;flex:1;line-height:1}
.sh-head .stripe{width:8px;height:28px;border-radius:4px}
.sh-body{overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sh-foot{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--muted)}
.sh-foot.one{grid-template-columns:1fr}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.lbl em{font-style:normal;color:var(--red);text-transform:none;letter-spacing:0}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:7px}
.chip{position:relative;border:2px solid var(--line);border-radius:10px;background:#fff;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;line-height:1}
.chip b{font-family:var(--f-display);font-size:24px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.chip span{font-size:12px;font-weight:700;color:var(--ink-2);margin-top:2px}
.chip.on{background:var(--navy);border-color:var(--navy)}
.chip.on b,.chip.on span{color:#fff}
.chip i{position:absolute;top:-7px;right:-5px;font-style:normal;font-size:10px;font-weight:800;background:var(--red);color:#fff;border-radius:6px;padding:2px 4px}
.chip.wide{grid-column:span 2;flex-direction:row;justify-content:center;gap:6px;font-weight:700}
.chip.lock{background:var(--navy-deep);border-color:var(--navy-deep)}
.chip.wide.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip:disabled{opacity:.3}
.sel-line{font-size:14px;font-weight:600;color:var(--ink);min-height:1.3em}
.err-msg{color:var(--red-deep);font-size:13px;font-weight:600;min-height:1em}

/* final */
.final-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.final-head img,.final-head .badge{height:72px;width:100%;object-fit:contain;margin:0 auto}
.final-head .badge{width:72px}
.final-head .fs{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.final-head .fs span{color:var(--ink-2);font-size:40px;padding:0 4px}
.final-head .ft{font-family:var(--f-display);font-weight:700;letter-spacing:.1em;color:var(--red);font-size:16px}
.final-head .tn{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.meta{text-align:center;color:var(--ink-2);font-weight:600;font-size:14px;margin:0}
.stbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.stbl th,.stbl td{padding:9px 6px;border-top:1px solid var(--muted);text-align:center}
.stbl tr:first-child th,.stbl tr:first-child td{border-top:0}
.stbl td.l{color:var(--ink-2);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;width:34%}
.stbl td.v{font-family:var(--f-display);font-weight:700;font-size:22px}
.stbl td.v small{font-family:var(--f-body);font-size:12px;color:var(--ink-2);font-weight:600;display:block}
.stbl thead th{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.ptbl{min-width:420px;font-size:14px}
.ptbl th,.ptbl td{padding:8px 4px}
.ptbl th.pn,.ptbl td.pn{text-align:left;white-space:nowrap;font-weight:600}
.ptbl td.num{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--navy)}
.ptbl td.pts{font-weight:800}
.ptbl td.pos{color:var(--good);font-weight:700}
.ptbl td.neg{color:var(--red-deep);font-weight:700}
.pertbl td,.pertbl th{padding:7px 4px}
.pertbl td:first-child{text-align:left;font-weight:700;font-size:13px}
.pertbl td.t{font-family:var(--f-display);font-weight:800;font-size:20px}
.glist{display:flex;flex-direction:column}
.gl{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--muted)}
.gl:first-child{border-top:0}
.gl .when{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.1;color:var(--ink-2)}
.gl .when b{display:block;color:var(--ink);font-size:18px}
.gl .who{min-width:0}
.gl .who b{font-weight:700}
.gl .who div{font-size:13px;color:var(--ink-2)}
.gl.k{border-left:4px solid var(--navy);padding-left:8px}
.gl.o{border-left:4px solid var(--opp);padding-left:8px}
.pp{font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 5px;border-radius:5px;background:var(--amber);color:var(--ink);vertical-align:2px;margin-left:4px}
.pp.gwg{background:var(--good);color:#fff}
.pp.sh{background:var(--red);color:#fff}
.empty{color:var(--ink-2);font-size:14px;margin:0}
.photo-wrap{display:flex;flex-direction:column;gap:12px;align-items:center}
.photo-wrap img{width:100%;max-width:420px;border-radius:10px;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.18);-webkit-touch-callout:default;user-select:auto}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;font-weight:600;font-size:14px;padding:10px 16px;border-radius:10px;max-width:90%;text-align:center;pointer-events:none;opacity:0;transition:opacity .18s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

const HOME = "Kitchener Jr Rangers";
let TEAMROSTER=(()=>{try{return JSON.parse(localStorage.getItem("kjr-stat-tracker-v1-roster"))}catch(e){return null}})();
function teamRoster(){return(TEAMROSTER||[]).map(p=>({n:p.n,name:p.name,g:!!p.g}))}
const STORE="kjr-stat-tracker-v1";

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ini=name=>{const w=name.trim().split(/\s+/);return((w[0]||"")[0]+((w[1]||"")[0]||"")).toUpperCase()};
const shortName=name=>{const w=name.trim().split(/\s+/);return w.length>1?w[0][0]+". "+w.slice(1).join(" "):name};
const PER=p=>["1st","2nd","3rd","OT"][p-1]||"OT";
const fmtT=t=>t==null?"—":Math.floor(t/60)+":"+String(t%60).padStart(2,"0");
const pct=(a,b)=>b?(a/b*100).toFixed(1)+"%":"—";
const svp=(sv,sa)=>sa?(sv/sa).toFixed(3).replace(/^0/,""):"—";

let S=fresh();
function fresh(){return{phase:"opp",opp:null,goalie:null,roster:teamRoster(),lens:lastLens().lens,otLen:lastLens().ot,start:null,events:[],photoAsked:false}}
function lastLens(){try{const v=JSON.parse(localStorage.getItem(STORE+"-lens"));if(v&&Array.isArray(v.lens)&&v.lens.length===3)return v}catch(e){}return{lens:[12,15,15],ot:5}}
function regMin(){return S.lens.reduce((a,b)=>a+b,0)}
function migrate(s){if(s&&!s.lens){const m=s.periodLen||15;s.lens=[m,m,m];s.otLen=s.otLen||5}return s}
function save(){if(VIEW)return;if(pending&&S.phase!=="game"&&S.phase!=="final")return;try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}if(TEAM&&iAmTracking())pushLive()}
function load(){try{const v=JSON.parse(localStorage.getItem(STORE));return v&&v.phase?migrate(v):null}catch(e){return null}}
const saved=load();
let pending=saved&&(saved.phase==="game"||saved.phase==="final")?saved:null;

function logoHTML(name,cls="logo"){
  const src=LOGOS[name];
  return src?`<img class="${cls}" src="${src}" alt="${esc(name)} logo">`:`<div class="${cls} badge">${esc(ini(name)||"?")}</div>`;
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),1500)}
function buzz(){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}

/* ---------- ice ---------- */
function drawIce(){
  const c=$("#ice"),d=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;
  c.width=W*d;c.height=H*d;const x=c.getContext("2d");x.setTransform(d,0,0,d,0,0);
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,"#f6fafc");g.addColorStop(1,"#e2ecf3");
  x.fillStyle=g;x.fillRect(0,0,W,H);
  // skate scratches
  let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  x.strokeStyle="rgba(140,165,190,.10)";x.lineWidth=1;
  for(let i=0;i<70;i++){const sx=rnd()*W,sy=rnd()*H,l=30+rnd()*120,a=(rnd()-.5)*.8;x.beginPath();x.moveTo(sx,sy);x.quadraticCurveTo(sx+l/2,sy+Math.sin(a)*l*.3,sx+l*Math.cos(a),sy+l*Math.sin(a));x.stroke()}
  // Rink runs top to bottom: nets at the top and bottom of the screen, every circle drawn round.
  const inset=5,rad=Math.min(W*.3,H*.16);
  x.lineWidth=5;x.strokeStyle="#b9c6d1";x.beginPath();x.roundRect(inset,inset,W-2*inset,H-2*inset,rad);x.stroke();
  x.lineWidth=2;x.strokeStyle="#e9b93a";x.beginPath();x.roundRect(inset+4,inset+4,W-2*inset-8,H-2*inset-8,rad-4);x.stroke();
  x.save();x.beginPath();x.roundRect(inset+6,inset+6,W-2*inset-12,H-2*inset-12,rad-6);x.clip();
  const gl=Math.max(36,H*.06),bw=Math.max(6,H*.011);
  // goal lines
  x.strokeStyle="rgba(211,33,44,.55)";x.lineWidth=2;[gl,H-gl].forEach(Y=>{x.beginPath();x.moveTo(0,Y);x.lineTo(W,Y);x.stroke()});
  // blue lines
  x.fillStyle="rgba(31,95,191,.45)";[H*.31,H*.69].forEach(Y=>x.fillRect(0,Y-bw/2,W,bw));
  // center line
  x.fillStyle="rgba(211,33,44,.6)";x.fillRect(0,H/2-bw/2,W,bw);
  x.fillStyle="rgba(255,255,255,.9)";for(let X=6;X<W;X+=22)x.fillRect(X,H/2-1,9,2);
  // center circle
  const cr=Math.min(W*.2,H*.11);x.strokeStyle="rgba(31,95,191,.5)";x.lineWidth=2;x.beginPath();x.arc(W/2,H/2,cr,0,7);x.stroke();
  x.fillStyle="rgba(31,95,191,.6)";x.beginPath();x.arc(W/2,H/2,4,0,7);x.fill();
  // end zone circles + dots
  const er=Math.min(W*.16,H*.085);
  [[W*.27,H*.18],[W*.73,H*.18],[W*.27,H*.82],[W*.73,H*.82]].forEach(([X,Y])=>{
    x.strokeStyle="rgba(211,33,44,.42)";x.lineWidth=2;x.beginPath();x.arc(X,Y,er,0,7);x.stroke();
    x.fillStyle="rgba(211,33,44,.5)";x.beginPath();x.arc(X,Y,4,0,7);x.fill();
  });
  [[W*.27,H*.36],[W*.73,H*.36],[W*.27,H*.64],[W*.73,H*.64]].forEach(([X,Y])=>{x.fillStyle="rgba(211,33,44,.45)";x.beginPath();x.arc(X,Y,4,0,7);x.fill()});
  // creases + nets
  const cz=Math.min(W*.1,H*.05);
  [[gl,1],[H-gl,-1]].forEach(([Y,dir])=>{
    x.fillStyle="rgba(120,180,235,.35)";x.strokeStyle="rgba(211,33,44,.55)";x.lineWidth=2;
    x.beginPath();x.moveTo(W/2-cz,Y);x.arc(W/2,Y,cz,Math.PI,0,dir>0);x.closePath();x.fill();x.stroke();
    const nw=cz*.6,nd=cz*.5;
    x.fillStyle="rgba(211,33,44,.12)";x.fillRect(W/2-nw,dir>0?Y-nd:Y,nw*2,nd);
    x.strokeStyle="rgba(211,33,44,.8)";x.lineWidth=3;x.beginPath();x.moveTo(W/2-nw,Y);x.lineTo(W/2-nw,Y-dir*nd);x.lineTo(W/2+nw,Y-dir*nd);x.lineTo(W/2+nw,Y);x.stroke();
  });
  x.restore();
}

/* ---------- derived stats ---------- */
let EDIT=null;
function ctxP(){return EDIT?EDIT.e.p:curPeriod()}
function curPeriod(){return 1+S.events.filter(e=>e.k==="end").length}
function isFinal(){const l=S.events[S.events.length-1];return !!(l&&l.k==="end"&&l.final)}
function lenOf(p){return(p<=3?S.lens[p-1]:S.otLen)*60}
function elapsed(p,t){let b=0;for(let i=1;i<p;i++)b+=lenOf(i);return b+(t==null?0:Math.max(0,lenOf(p)-t))}
function calc(){
  const T=()=>({fo:0,g:0,sh:0,pim:0,pens:0,ppo:0,ppg:0,shg:0,byP:{},shByP:{}});
  const c={K:T(),O:T()};
  const goalies=[];let cur={...S.goalie,from:0,sa:0,ga:0};goalies.push(cur);
  const maxP=Math.max(3,curPeriod());
  for(const e of S.events){
    if(e.k==="fo")c[e.s].fo++;
    if(e.k==="shot"||e.k==="goal"){const t=c[e.s];t.sh++;t.shByP[e.p]=(t.shByP[e.p]||0)+1;if(e.s==="O")cur.sa++}
    if(e.k==="goal"){const t=c[e.s];t.g++;t.byP[e.p]=(t.byP[e.p]||0)+1;if(e.type==="PP")t.ppg++;if(e.type==="SH")t.shg++;if(e.s==="O")cur.ga++}
    if(e.k==="pen"){const t=c[e.s];t.pim+=e.pim;t.pens++;if(e.pp)c[e.s==="K"?"O":"K"].ppo++}
    if(e.k==="gch"){const at=elapsed(e.p,e.t);cur.to=at;cur={...e.g,from:at,sa:0,ga:0};goalies.push(cur)}
  }
  // game length
  let endSec=0;const played=isFinal()?curPeriod()-1:curPeriod();
  for(let i=1;i<=played;i++)endSec+=lenOf(i);
  if(isFinal()&&played===4){const lastOT=[...S.events].reverse().find(e=>e.k==="goal"&&e.p===4&&e.t!=null);if(lastOT)endSec=elapsed(4,lastOT.t)}
  cur.to=endSec;
  goalies.forEach(g=>{g.sec=Math.max(0,g.to-g.from)});
  const reg=regMin()*60;
  c.K.sv=c.O.sh-c.O.g;c.O.sv=c.K.sh-c.K.g;
  c.K.gaa=endSec?c.O.g*reg/endSec:0;c.O.gaa=endSec?c.K.g*reg/endSec:0;
  const merged=[];for(const g of goalies){const m=merged.find(x=>x.n===g.n&&x.name===g.name);if(m){m.sa+=g.sa;m.ga+=g.ga;m.sec+=g.sec}else merged.push({n:g.n,name:g.name,sa:g.sa,ga:g.ga,sec:g.sec})}
  return{c,goalies:merged.filter(g=>g.sec>0||g.sa>0),endSec,played,maxP};
}

const HIST=STORE+"-history";
let VIEW=null,LIVE=null,HLIST=null,HEDIT=false,GONE=new Set(),hUnsub=null,hNote="",hTimer=null,dbP=null;
function localHist(){try{return JSON.parse(localStorage.getItem(HIST))||{}}catch(e){return{}}}
function setLocalHist(h){try{localStorage.setItem(HIST,JSON.stringify(h))}catch(e){}}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

async function watchHistory(){

    if(!snap.metadata.fromCache){clearTimeout(hTimer);hNote="";{const h=localHist(),have=new Set(HLIST.map(g=>g.id));let ch=false;for(const id in h)if(h[id].synced&&!have.has(id)){delete h[id];ch=true}if(ch)setLocalHist(h)}
      if(!synced){synced=true;const h=localHist(),have=new Set(HLIST.map(g=>g.id));
        (async()=>{for(const id in h){if(!h[id].synced&&!have.has(id)){const{synced:_,...rec}=h[id];try{await db.collection("games").doc(id).set(rec);h[id].synced=true;setLocalHist(h)}catch(e){}}}})();}}
    if(VIEW==="list")viewHistory();

}
function allGames(){
  const m={},h=localHist();
  for(const id in h)m[id]=h[id];

  return Object.values(m).filter(g=>g&&(g.state||g.summary)&&!GONE.has(g.id)).sort((a,b)=>(b.start||0)-(a.start||0));
}

let SSORT="P";const SUMCACHE=new Map();
const n0=v=>{v=Number(v);return isFinite(v)?v:0};
function gameSummary(g){
  if(g.summary)return{...g.summary,id:g.id,start:g.start,opp:g.opp,k:g.k,o:g.o,ot:g.ot};
  const ck=g.id+":"+(g.savedAt||0);if(SUMCACHE.has(ck))return SUMCACHE.get(ck);
  const keep=S,keepE=EDIT;EDIT=null;let out;
  try{
    S=JSON.parse(JSON.stringify(g.state));if(!S.lens)migrate(S);
    const r=calc(),ps=playerStats(),t=x=>({sh:x.sh,pim:x.pim,ppg:x.ppg,ppo:x.ppo,fo:x.fo,shg:x.shg});
    out={id:g.id,start:g.start,opp:S.opp,k:r.c.K.g,o:r.c.O.g,ot:r.played===4,regSec:regMin()*60,K:t(r.c.K),O:t(r.c.O),
      players:ps.list.map(p=>({n:p.n,name:p.name,G:p.G,A:p.A,PM:p.PM,PIM:p.PIM,PPG:p.PPG,SHG:p.SHG,GWG:p.GWG,FOW:p.FOW,FOL:p.FOL})),
      goalies:r.goalies.map(x=>({n:x.n,name:x.name,sa:x.sa,ga:x.ga,sec:x.sec}))};
  }finally{S=keep;EDIT=keepE}
  SUMCACHE.set(ck,out);return out;
}
function seasonStats(){
  const games=allGames().map(gameSummary);
  const z=()=>({sh:0,pim:0,ppg:0,ppo:0,fo:0,shg:0});
  const T={gp:games.length,w:0,l:0,t:0,otw:0,otl:0,gf:0,ga:0,K:z(),O:z()};
  const P=new Map(),G=new Map();
  for(const g of games){
    const k=n0(g.k),o=n0(g.o);T.gf+=k;T.ga+=o;
    if(k>o){T.w++;if(g.ot)T.otw++}else if(k<o){T.l++;if(g.ot)T.otl++}else T.t++;
    for(const s of["K","O"])for(const f in T[s])T[s][f]+=n0(g[s]&&g[s][f]);
    for(const p of g.players||[]){
      const key=String(p.n);if(!P.has(key))P.set(key,{n:n0(p.n),name:p.name,GP:0,G:0,A:0,PM:0,PIM:0,PPG:0,SHG:0,GWG:0,FOW:0,FOL:0});
      const x=P.get(key);x.name=p.name||x.name;x.GP++;for(const f of["G","A","PM","PIM","PPG","SHG","GWG","FOW","FOL"])x[f]+=n0(p[f]);
    }
    const gl=(g.goalies||[]).filter(x=>n0(x.sec)>0||n0(x.sa)>0);
    const dec=gl.slice().sort((a,b)=>n0(b.sec)-n0(a.sec))[0];
    for(const q of gl){
      const key=String(q.n);if(!G.has(key))G.set(key,{n:n0(q.n),name:q.name,GP:0,w:0,l:0,t:0,sa:0,ga:0,sec:0,eq:0});
      const x=G.get(key);x.name=q.name||x.name;x.GP++;x.sa+=n0(q.sa);x.ga+=n0(q.ga);x.sec+=n0(q.sec);x.eq+=n0(q.sec)/(n0(g.regSec)||2520);
      if(q===dec){if(k>o)x.w++;else if(k<o)x.l++;else x.t++}
    }
  }
  const skaters=[...P.values()].map(x=>({...x,P:x.G+x.A}));
  return{T,skaters,goalies:[...G.values()],games};
}
const per=(v,gp)=>gp?(v/gp).toFixed(1):"—";
const SCOLS=[["GP","GP"],["G","G"],["A","A"],["P","P"],["PM","+/-"],["PIM","PIM"],["PPG","PPG"],["SHG","SHG"],["GWG","GWG"],["FO","FO"],["FOP","FO%"]];
function skSort(list){
  const v=(x,k)=>k==="FOP"?(x.FOW+x.FOL?x.FOW/(x.FOW+x.FOL):-1):k==="FO"?x.FOW+x.FOL:x[k];
  return list.slice().sort((a,b)=>v(b,SSORT)-v(a,SSORT)||b.P-a.P||b.G-a.G||a.n-b.n);
}

let RV=null,UPG=null,smP=null,asP=null;
async function prepImage(file,maxBytes,types){
  if(file.size<=maxBytes&&(!types||types.includes(file.type)))return file;
  const url=URL.createObjectURL(file);
  try{
    const img=await loadImg(url);if(!img)return file;
    const sc=Math.min(1,2400/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.88));
  }finally{URL.revokeObjectURL(url)}
}
const PHOTO_PROMPT="";
function matchTeam(name){

}

function blankReview(){return{id:null,opp:"",date:new Date().toISOString().slice(0,10),time:"",k:0,o:0,ot:false,lens:lastLens().lens.slice(),K:{sh:0,pim:0,ppg:0,ppo:0,fo:0,shg:0},O:{sh:0,pim:0,ppg:0,ppo:0,fo:0,shg:0},players:[],goalies:[],files:{},photos:{}}}

/* the same small storage interfaces the rest of the app already uses */
function getDB(){if(!dbP)dbP=(async()=>{if(!TEAM||!TDB||TDB.noConfig)return null;await TDB.ready;return{collection:name=>({
  doc:id=>({set:d=>TDB.set(tpath(name,id),d),delete:()=>TDB.del(tpath(name,id))}),
  orderBy:(f,dir)=>({onSnapshot:(cb,err)=>TDB.watchColl(tpath(name),f,dir,(docs,meta)=>cb({docs:docs.map(d=>({data:()=>d})),metadata:meta}),err)})})}})();return dbP}
function getSample(){return Promise.resolve(null)}
async function compressPhoto(blob){
  const url=URL.createObjectURL(blob);
  try{const img=await loadImg(url);if(!img)throw new Error("bad image");
    for(const [side,q] of[[1600,.82],[1400,.75],[1200,.7],[1000,.65],[800,.6]]){
      const sc=Math.min(1,side/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      const d=c.toDataURL("image/jpeg",q);if(d.length<900000)return d}
    throw new Error("too big")}finally{URL.revokeObjectURL(url)}
}
function getAssets(){return Promise.resolve(TEAM&&isAdmin()&&TDB&&!TDB.noConfig?{
  upload:async blob=>{const data=await compressPhoto(blob),id=newId();await TDB.set(tpath("photos",id),{data,at:Date.now()});PHOTOCACHE.set(id,data);return{id,url:data}},
  delete:id=>TDB.del(tpath("photos",id))}:null)}
const blobURL=id=>"";
function hydratePhotos(){
  document.querySelectorAll("img[data-photo]").forEach(async im=>{
    const id=im.dataset.photo;let d=PHOTOCACHE.get(id);
    if(!d){try{const r=await TDB.get(tpath("photos",id));d=r&&r.data;if(d)PHOTOCACHE.set(id,d)}catch(e){}}
    if(d)im.src=d;else{const p=document.createElement("p");p.className="empty";p.textContent="This photo couldn't be loaded. Check your connection.";im.replaceWith(p)}
  });
}
function getDL(){return Promise.resolve({save:async({filename,data})=>{
  const blob=data instanceof Blob?data:new Blob([data],{type:/\.csv$/i.test(filename)?"text/csv":"application/octet-stream"});
  if(blob.type.startsWith("image/")){
    try{const f=new File([blob],filename,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return{status:"saved"}}}
    catch(e){if(e&&e.name==="AbortError")throw Object.assign(new Error("declined"),{code:"declined"})}
  }
  const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
  return{status:"saved"};
}})}

/* ---------- live game: one tracker, everyone else watches ---------- */
function startLiveWatch(){
  if(liveUnsub||!TEAM||!TDB||TDB.noConfig)return;
  liveUnsub=TDB.watchDoc(tpath("live","current"),d=>{LIVEDOC=d;onLiveChange()},()=>{});
}
function stopLiveWatch(){if(liveUnsub){liveUnsub();liveUnsub=null}LIVEDOC=null}
function iAmTracking(){return !VIEW&&(S.phase==="game"||S.phase==="final")&&S.gameId&&S.trackerUid===ME}
function onLiveChange(){
  const d=LIVEDOC;
  // someone else took over the game I was tracking
  if(iAmTracking()&&d&&d.trackerUid!==ME&&(d.gameId===S.gameId||d.phase==="game")){
    toast(`${d.trackerName||"Someone"} took over tracking. You're now watching.`);
    S=fresh();try{localStorage.removeItem(STORE)}catch(e){}pending=null;watchLive();return;
  }
  if(VIEW==="watch"){
    if(!d||!d.state){VIEW=null;S=fresh();render();toast("The live game was closed.");return}
    if(d.trackerUid===ME){VIEW=null;S=clone(d.state);render();return}
    const y=scrollY,open=document.querySelector(".scrim");S=clone(d.state);if(!S.lens)migrate(S);
    if(!open){render();scrollTo(0,y)}else updateWatchBar();
    return;
  }
  if(!VIEW&&(S.phase==="opp"||S.phase==="goalie"||S.phase==="roster"))render();
}
function livePayload(extra){return{phase:S.phase,gameId:S.gameId,trackerUid:ME,trackerName:TEAM.name,heartbeat:Date.now(),takeover:false,opp:S.opp,state:clone(S),...extra}}
function pushLive(){
  clearTimeout(livePushT);
  livePushT=setTimeout(async()=>{
    if(!iAmTracking()||!TDB||TDB.noConfig)return;
    try{await TDB.set(tpath("live","current"),livePayload())}
    catch(e){if(e.code==="permission_denied"){const d=LIVEDOC;toast(`${d&&d.trackerName||"Someone else"} is tracking now. You're watching.`);S=fresh();pending=null;watchLive()}}
  },250);
}
setInterval(()=>{if(iAmTracking()&&S.phase==="game")pushLive();if(VIEW==="watch")updateWatchBar()},30000);
async function claimLive(takeover){
  const next=livePayload({takeover:!!takeover});
  try{
    await TDB.claim(tpath("live","current"),cur=>{
      if(!takeover&&cur&&cur.phase==="game"&&cur.trackerUid!==ME)throw Object.assign(new Error("busy"),{code:"busy",cur});
      return next;
    });
    return true;
  }catch(e){
    if(e.code==="busy"){busySheet(e.cur);return false}
    if(e.code==="timeout"||e.code==="unavailable"){TDB.set(tpath("live","current"),next).catch(()=>{});toast("You're offline. The team will see this game once you're back online.");return true}
    toast("Couldn't start tracking: "+(e.code==="permission_denied"?"this phone isn't allowed to. Re-enter the team code in Settings.":"check your connection and try again."));return false;
  }
}
function releaseLive(){if(TDB&&LIVEDOC&&LIVEDOC.trackerUid===ME)TDB.del(tpath("live","current")).catch(()=>{})}
function busySheet(cur){
  sheet({title:"Someone is already tracking",stripe:"var(--amber)",okLabel:"Watch live",cancel:"Close",
    body:`<p class="hint"><b>${esc(cur.trackerName||"Someone")}</b> is tracking the game vs <b>${esc(cur.opp||"")}</b>. Only one person can track at a time.</p>
      <p class="hint">If their phone died or they had to leave, you can take over. They'll switch to watching.</p>
      <button class="btn btn-ghost" id="bsTake">Take over tracking</button>`,
    mount:(r,close)=>{r.querySelector("#bsTake").onclick=()=>{close();takeOver()}},
    onOk:()=>{watchLive()}});
}
function watchLive(){if(!LIVEDOC||!LIVEDOC.state){VIEW=null;render();return}if(!VIEW)LIVE=null;VIEW="watch";S=clone(LIVEDOC.state);if(!S.lens)migrate(S);render();scrollTo(0,0)}
function takeOver(){
  const d=LIVEDOC;if(!d||!d.state){toast("There's no live game to take over.");return}
  confirmSheet("Take over tracking?",`${d.trackerName||"The current tracker"} is tracking now. You'll be able to enter stats and their phone will switch to view-only. The game will show it was tracked by both of you.`,"Take over",async()=>{
    const st=clone(d.state);if(!st.lens)migrate(st);
    st.trackers=(st.trackers||[]).concat([{uid:ME,name:TEAM.name,at:Date.now(),takeover:true}]);st.trackerUid=ME;
    const keep=S,keepV=VIEW;S=st;VIEW=null;
    const ok=await claimLive(true);
    if(!ok){S=keep;VIEW=keepV;render();return}
    pending=null;render();wake();toast("You're tracking now");
  });
}
function watchBarHTML(){
  const d=LIVEDOC;if(!d)return"";
  const stale=Date.now()-(d.heartbeat||0)>120000&&d.phase==="game";
  return`<div class="watchbar ${stale?"stale":""}"><span class="dot"></span><span class="wtxt"><b>${d.phase==="game"?"LIVE":"FINAL"}</b> · Tracked by ${esc(trackerNames(d.state)||d.trackerName||"")} · <span id="wAgo">updated ${ago(d.heartbeat||0)}</span></span></div>`;
}
function updateWatchBar(){const e=$("#wAgo");if(e&&LIVEDOC)e.textContent="updated "+ago(LIVEDOC.heartbeat||0)}
function decorateWatchGame(){

async function startTracked(){
  if(LIVEDOC&&LIVEDOC.phase==="game"&&LIVEDOC.trackerUid!==ME){busySheet(LIVEDOC);return}
  const btn=$("#start");if(btn){btn.disabled=true;btn.textContent="Starting…"}

function viewJoin(msg){
  $("#app").innerHTML=`<section class="screen"><div class="wrap">
    ${brand()}

      <div class="seg" id="jmode"><button data-m="join" class="${JOINMODE==="join"?"on":""}">Join your team</button><button data-m="new" class="${JOINMODE==="new"?"on":""}">Set up a new team</button></div>

        <p class="hint">Enter the team code your coach or team manager gave you.</p>
        <div class="field"><label for="jCode">Team code</label><input id="jCode" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="e.g. rangers-u13-2026"></div>
        <div class="field"><label for="jName">Your name</label><input id="jName" autocomplete="name" placeholder="Shown when you track a game"></div>
        <p class="err-msg" id="jErr"></p>
        <button class="btn btn-primary btn-big" id="jGo">Join team</button>`
      :`
        <p class="hint">Do this once. You'll be the team's first admin. Share the team code with everyone; keep the admin code to yourself.</p>
        <div class="field"><label for="nCode">Team code (everyone uses this)</label><input id="nCode" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="e.g. rangers-u13-2026"></div>
        <div class="field"><label for="nAdmin">Admin code (only you)</label><input id="nAdmin" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="At least 6 characters"></div>
        <div class="field"><label for="nName">Your name</label><input id="nName" autocomplete="name"></div>
        <p class="hint" style="font-size:13px">Team codes use letters, numbers and dashes, 6 to 40 characters. Pick something hard to guess.</p>
        <p class="err-msg" id="jErr"></p>
        <button class="btn btn-primary btn-big" id="nGo">Create team</button>`}
    </div>
  </div></section>`;
  $("#jmode").onclick=e=>{const b=e.target.closest("button");if(b){JOINMODE=b.dataset.m;viewJoin()}};
  const err=t=>{$("#jErr").textContent=t};
  if(JOINMODE==="join")$("#jGo").onclick=async()=>{
    const code=normCode($("#jCode").value),name=$("#jName").value.trim();
    if(!codeOK(code))return err("Check the team code. It uses letters, numbers and dashes.");
    if(!name)return err("Enter your name.");
    const b=$("#jGo");b.disabled=true;b.textContent="Checking…";
    try{const info=await TDB.get(`teams/${code}/meta/info`);
      if(!info){b.disabled=false;b.textContent="Join team";return err("No team uses that code. Check it with your coach.")}
      setTeam({code,name,admin:false});await afterJoin();toast(`Joined. Welcome, ${name}!`);
    }catch(e){b.disabled=false;b.textContent="Join team";err(e.code==="unavailable"||e.code==="timeout"?"You're offline. Connect to the internet to join.":"Couldn't join: "+e.message)}
  };
  else $("#nGo").onclick=async()=>{
    const code=normCode($("#nCode").value),admin=$("#nAdmin").value.trim(),name=$("#nName").value.trim();
    if(!codeOK(code))return err("Team code: 6 to 40 letters, numbers or dashes.");
    if(admin.length<6)return err("Admin code: at least 6 characters.");
    if(admin===code)return err("Make the admin code different from the team code.");
    if(!name)return err("Enter your name.");
    const b=$("#nGo");b.disabled=true;b.textContent="Creating…";
    try{
      if(await TDB.get(`teams/${code}/meta/info`)){b.disabled=false;b.textContent="Create team";return err("That team code is already taken. Pick another.")}
      await createTeam(code,admin,name);
      setTeam({code,name,admin:true});await afterJoin();toast("Team created. Share the team code with your team.");
    }catch(e){b.disabled=false;b.textContent="Create team";err(e.code==="permission_denied"?"That team code is already taken. Pick another.":e.code==="unavailable"?"You're offline. Connect to the internet to set up the team.":"Couldn't create the team: "+e.message)}
  };
}
function createTeam(code,admin,name){
  return TDB.batch([
    {op:"set",path:`teams/${code}/meta/info`,data:{team:HOME,createdBy:ME,createdAt:Date.now()}},
    {op:"set",path:`teams/${code}/private/admin`,data:{code:admin}},
    {op:"set",path:`teams/${code}/admins/${ME}`,data:{code:admin,name,at:Date.now()}},
  ]);
}
async function afterJoin(){
  stopLiveWatch();stopRoster();stopOpps();applyOpps([]);if(hUnsub){hUnsub();hUnsub=null}HLIST=null;

function moveTeamSheet(){
  sheet({title:"Change team code",stripe:"var(--red)",okLabel:"Change code",

      (async()=>{
        try{

          for(let i=0;i<games.length;i+=200)await TDB.batch(games.slice(i,i+200).map(g=>({op:"set",path:`teams/${code}/games/${g.id}`,data:g.data})));
          for(const p of photos)await TDB.set(`teams/${code}/photos/${p.id}`,p.data);
          const dels=[...opps.map(o=>`teams/${old}/opponents/${o.id}`),...games.map(g=>`teams/${old}/games/${g.id}`),...photos.map(p=>`teams/${old}/photos/${p.id}`),`teams/${old}/live/current`];
          for(let i=0;i<dels.length;i+=200)await TDB.batch(dels.slice(i,i+200).map(path=>({op:"del",path})));
          await TDB.batch([{op:"del",path:`teams/${old}/meta/roster`},{op:"del",path:`teams/${old}/meta/info`},{op:"del",path:`teams/${old}/private/admin`}]);
          await TDB.del(`teams/${old}/admins/${ME}`).catch(()=>{});
          r.remove();setTeam({...TEAM,code,admin:true});await afterJoin();
          sheet({title:"Team code changed",stripe:"var(--good)",okLabel:"Done",single:true,body:`<p class="hint">The new team code is</p><p style="font-family:var(--f-display);font-size:30px;font-weight:800;margin:0">${esc(code)}</p><p class="hint">Send it to everyone. The old code no longer works.</p>`,onOk:()=>{}});
        }catch(e){okb.disabled=false;okb.textContent="Change code";
          err(e.code==="taken"?"That team code is already taken. Pick another.":e.code==="permission_denied"?"That admin code isn't right.":"Something went wrong: "+e.message+". Nothing was deleted from the old code.")}
      })();
      return false;
    }});
}

// shrink a picked logo: trim blank margins, fit in 240px, keep transparency
async function makeLogo(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await loadImg(url);if(!img)throw new Error("That file isn't a picture this phone can open.");
    const c=document.createElement("canvas");c.width=img.width;c.height=img.height;const x=c.getContext("2d");x.drawImage(img,0,0);
    let d;try{d=x.getImageData(0,0,c.width,c.height).data}catch(e){d=null}
    let L=0,T=0,R=c.width-1,B=c.height-1;
    if(d){const blank=i=>d[i+3]<20||(d[i]>242&&d[i+1]>242&&d[i+2]>242);L=c.width;T=c.height;R=-1;B=-1;
      for(let y=0;y<c.height;y+=2)for(let xx=0;xx<c.width;xx+=2){if(!blank((y*c.width+xx)*4)){if(xx<L)L=xx;if(xx>R)R=xx;if(y<T)T=y;if(y>B)B=y}}
      if(R<0){L=0;T=0;R=c.width-1;B=c.height-1}}
    const w=R-L+1,h=B-T+1,sc=Math.min(1,240/Math.max(w,h)),o=document.createElement("canvas");
    o.width=Math.max(1,Math.round(w*sc));o.height=Math.max(1,Math.round(h*sc));o.getContext("2d").drawImage(c,L,T,w,h,0,0,o.width,o.height);
    let out=o.toDataURL("image/png");if(out.length>200000)out=o.toDataURL("image/webp",.9);if(out.length>200000||!out.startsWith("data:image/webp")&&out.length>200000)out=o.toDataURL("image/jpeg",.85);
    return out;
  }finally{URL.revokeObjectURL(url)}
}

const pkey=p=>p.n+"|"+p.name;
const pobj=p=>p?{n:p.n,name:p.name}:null;

function iceHTML(){

  <p class="err-msg" id="iceErr"></p>`;
}
function bindIce(r,locked=()=>[],init){
  const st={sel:new Set(Array.isArray(init)?init.map(pkey):[]),ns:init===null};
  const lk=()=>new Set(locked().filter(Boolean).filter(p=>!p.g).map(pkey));
  const all=()=>new Set([...st.sel,...lk()]);
  const paint=()=>{const L=lk();
    r.querySelectorAll("#icec [data-ice]").forEach(x=>{const k=x.dataset.ice;x.classList.toggle("on",st.sel.has(k)||L.has(k));x.classList.toggle("lock",L.has(k))});
    r.querySelector("#icens").classList.toggle("on",st.ns);
    const n=all().size;r.querySelector("#iceSel").textContent=st.ns?"Not sure":n?n+" picked":"";};
  r.querySelector("#icec").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;r.querySelector("#iceErr").textContent="";
    if(b.id==="icens"){st.ns=!st.ns;if(st.ns)st.sel.clear();paint();return}
    const k=b.dataset.ice;if(lk().has(k))return;st.ns=false;
    if(st.sel.has(k))st.sel.delete(k);else{if(all().size>=6){r.querySelector("#iceErr").textContent="Up to 6 skaters can be on the ice.";return}st.sel.add(k)}
    paint()};
  paint();
  let warned=false;
  return{paint,
    // returns undefined to block saving, null for "not sure", or the list of skaters
    read:(t)=>{
      if(st.ns)return null;
      const n=all().size,err=r.querySelector("#iceErr");
      if(!n){err.textContent="Pick who was on the ice, or tap Not sure.";r.querySelector("#icec").scrollIntoView({block:"nearest"});return undefined}
      const at=elapsed(ctxP(),t),need=Math.max(3,(ctxP()<=3?5:3)-boxCounter()("K",at));
      if(n<need&&!warned){warned=true;err.textContent=`Only ${n} skater${n>1?"s":""} picked. Pick the rest, or tap Add goal again to save anyway.`;r.querySelector("#icec").scrollIntoView({block:"nearest"});return undefined}
      return[...all()].map(findP).filter(Boolean).map(pobj);
    }};
}
function foSheet(s){

  const list=skaters().sort((a,b)=>(cnt[pkey(b)]||0)-(cnt[pkey(a)]||0)||a.n-b.n);

    body:`<div class="lbl">${won?"Which Rangers player won it?":"Which Rangers player lost it?"}</div>

      <div class="chips" id="foc">${list.map(p=>`<button class="chip" data-fo="${p.n}|${esc(p.name)}"><b>${p.n}</b><span>${ini(p.name)}</span>${cnt[pkey(p)]?`<i>${cnt[pkey(p)]}</i>`:""}</button>`).join("")}</div>`,
    mount:(r,close)=>{r.querySelector("#foc").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;const pl=findP(b.dataset.fo);close();recFO(s,pl)}},
    onOk:()=>{recFO(s,null)}});

function sheet({title,stripe,body,okLabel,onOk,mount,cancel="Cancel",single,onClose}){

  </div>`;
  document.body.appendChild(el);

function timeField(id="tr"){

}
function bindTime(root,id="tr",onValid){
  const i=root.querySelector("#"+id);
  i.addEventListener("input",()=>{const d=i.value.replace(/\D/g,"").slice(0,4);i.value=d.length>2?d.slice(0,-2)+":"+d.slice(-2):d;i.classList.remove("err");root.querySelector("#"+id+"Err").textContent="";
    if(onValid&&d.length>=3){const m=+d.slice(0,-2),s=+d.slice(-2);if(s<60&&m*60+s<=lenOf(ctxP()))onValid(m*60+s)}});
}
/* Who is in the box at a given clock time. Minors end early when the other team scores on the power play. */
function boxCounter(){
  const act=[];
  for(const e of S.events){
    if(EDIT&&e===EDIT.e)continue;
    if(e.k==="pen"&&e.pp&&e.t!=null){const st=elapsed(e.p,e.t);act.push({s:e.s,start:st,end:st+(e.pim===12?2:e.pim)*60,minor:e.pim===2||e.pim===12})}
    if(e.k==="goal"&&e.t!=null){
      const g=elapsed(e.p,e.t),other=e.s==="K"?"O":"K",on=a=>a.start<=g&&g<a.end;
      const n=s=>act.filter(a=>a.s===s&&on(a)).length;
      if(n(other)>n(e.s)){const m=act.filter(a=>a.s===other&&a.minor&&on(a)).sort((a,b)=>a.start-b.start)[0];if(m)m.end=g}
    }
  }
  return(s,at)=>act.filter(a=>a.s===s&&a.start<=at&&at<a.end).length;
}
function suggestType(side,sec){
  const at=elapsed(ctxP(),sec),box=boxCounter(),other=side==="K"?"O":"K";
  const mine=box(side,at),theirs=box(other,at),nm=s=>s==="K"?"Rangers":S.opp;
  if(theirs>mine)return{type:"PP",note:`Set to power play: ${nm(other)} had ${theirs} in the box. Tap another type if that's wrong.`};
  if(mine>theirs)return{type:"SH",note:`Set to shorthanded: ${nm(side)} had ${mine} in the box. Tap another type if that's wrong.`};
  return{type:"EV",note:mine?"Both teams had players in the box, so this is set to even strength.":""};
}
function autoType(r,side,setType){

  bindSeg(r,"tseg",b=>{setType(b.dataset.t);touched=true;r.querySelector("#tnote").textContent=""});
  bindTime(r,"tr",sec=>{if(touched)return;const g=suggestType(side,sec);setType(g.type);
    r.querySelectorAll("#tseg button").forEach(x=>x.classList.toggle("on",x.dataset.t===g.type));r.querySelector("#tnote").textContent=g.note});
}
function readTime(root,id="tr"){
  const i=root.querySelector("#"+id),v=i.value.trim(),err=root.querySelector("#"+id+"Err");
  if(!v){i.classList.add("err");err.textContent="Enter the time left on the clock.";i.focus();return undefined}
  const d=v.replace(/\D/g,"");let m,s;
  if(d.length<=2){m=0;s=+d}else{m=+d.slice(0,-2);s=+d.slice(-2)}
  const max=lenOf(ctxP());
  if(s>59||m*60+s>max){i.classList.add("err");err.textContent=`Use MM:SS, up to ${max/60}:00.`;return undefined}
  return m*60+s;
}

function goalSheetK(){
  const ed=EDIT&&EDIT.e;
  let sc=ed?(findP(pkey(ed.sc))||ed.sc):null,as=ed?[ed.a1,ed.a2].filter(Boolean).map(a=>findP(pkey(a))||a):[],un=!!(ed&&!ed.a1),type=ed?ed.type:"EV",ice=null;

    }

}

/* ---------- photo ---------- */
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function makePhoto(){
  try{await Promise.all(["800 40px 'Saira Condensed'","700 30px 'Saira Condensed'","600 26px Barlow","400 26px Barlow"].map(f=>document.fonts.load(f)))}catch(e){}
  const {c,goalies,played}=calc(),ot=played===4,pers=[1,2,3].concat(ot?[4]:[]);
  const goals=goalRows(),pens=S.events.filter(e=>e.k==="pen");
  const [lo,lk]=await Promise.all([loadImg(LOGOS[S.opp]),loadImg(LOGOS[HOME])]);
  const W=1080,P=56,D="'Saira Condensed','Arial Narrow',sans-serif",B="Barlow,system-ui,sans-serif";
  const rows=statRows(c);
  // Draw on a tall scratch canvas, then crop to the exact content height so nothing is ever cut off.
  const H=600+ (5*96) + rows.length*80 + goalies.length*56 + goals.length*140 + pens.length*60 + 1600;
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");
  x.fillStyle="#f1f6fa";x.fillRect(0,0,W,H);
  const wrap=(text,maxW)=>{const words=String(text).split(" "),out=[];let line="";for(const w of words){const t=line?line+" "+w:w;if(x.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t}if(line)out.push(line);return out};
  const fit=(text,maxW,size,weight,fam)=>{let s=size;do{x.font=`${weight} ${s}px ${fam}`;if(x.measureText(text).width<=maxW)break;s-=1}while(s>14);return s};
  // header
  x.fillStyle="#0b2350";x.fillRect(0,0,W,170);x.fillStyle="#d3212c";x.fillRect(0,166,W,8);
  x.fillStyle="#f4b223";x.font=`700 26px ${D}`;x.textBaseline="alphabetic";x.fillText("KITCHENER JR RANGERS STAT TRACKER",P,62);
  x.fillStyle="#fff";x.font=`800 60px ${D}`;x.fillText("GAME SUMMARY",P,128);
  const d=new Date(S.start||Date.now());
  x.textAlign="right";x.font=`600 26px ${B}`;x.fillStyle="#cfe0f5";
  x.fillText(d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"}),W-P,92);
  x.fillText("Start "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}),W-P,128);
  x.textAlign="left";
  let y=200;
  // score block
  const box=(X,Y,w,h)=>{x.fillStyle="#fff";x.strokeStyle="#c8d5e0";x.lineWidth=2;x.beginPath();x.roundRect(X,Y,w,h,18);x.fill();x.stroke()};
  box(P,y,W-2*P,300);
  const drawLogo=(img,name,cx)=>{const s=170;if(img){const r=Math.min(s/img.width,s/img.height);x.drawImage(img,cx-img.width*r/2,y+30+(s-img.height*r)/2,img.width*r,img.height*r)}else{x.fillStyle="#2b2f37";x.beginPath();x.arc(cx,y+115,80,0,7);x.fill();x.fillStyle="#fff";x.font=`800 64px ${D}`;x.textAlign="center";x.fillText(ini(name),cx,y+137)}
    x.textAlign="center";x.fillStyle="#0d1b33";fit(name.toUpperCase(),310,24,700,B);x.fillText(name.toUpperCase(),cx,y+250);x.textAlign="left"};
  drawLogo(lo,S.opp,P+170);drawLogo(lk,HOME,W-P-170);
  x.textAlign="center";x.fillStyle="#d3212c";x.font=`700 30px ${D}`;x.fillText("FINAL"+(ot?" / OT":""),W/2,y+78);
  x.fillStyle="#0d1b33";x.font=`800 130px ${D}`;x.fillText(`${c.O.g}–${c.K.g}`,W/2,y+210);
  const gw=gwg();if(gw){const s="GWG  "+gwgLabel(gw);fit(s,300,24,700,B);x.fillStyle="#178a4c";x.fillText(s,W/2,y+262)}
  x.textAlign="left";
  y+=330;
  const section=t=>{x.fillStyle="#0b2350";x.font=`800 38px ${D}`;x.fillText(t.toUpperCase(),P,y+44);x.fillStyle="#d3212c";x.fillRect(P,y+58,70,5);y+=90};
  // by period
  section("By period");
  const colW=110,c0=P+330;
  x.font=`700 24px ${B}`;x.fillStyle="#4a5b74";x.textAlign="center";
  pers.concat(["T"]).forEach((p,i)=>x.fillText(p==="T"?"T":PER(p),c0+i*colW,y+20));
  y+=26;
  const prow=(label,k,key)=>{x.textAlign="left";x.fillStyle="#0d1b33";fit(label,c0-P-60,26,600,B);x.fillText(label,P,y+40);x.textAlign="center";
    pers.forEach((p,i)=>{x.font=`600 30px ${D}`;x.fillText(c[k][key][p]||0,c0+i*colW,y+40)});
    x.font=`800 34px ${D}`;x.fillText(key==="byP"?c[k].g:c[k].sh,c0+pers.length*colW,y+40);
    x.strokeStyle="#dfe9f1";x.lineWidth=2;x.beginPath();x.moveTo(P,y+56);x.lineTo(W-P,y+56);x.stroke();y+=56};
  prow(S.opp+" goals","O","byP");prow("Rangers goals","K","byP");prow(S.opp+" shots","O","shByP");prow("Rangers shots","K","shByP");
  x.textAlign="left";y+=30;
  // team stats
  section("Team stats");
  x.fillStyle="#4a5b74";x.textAlign="center";fit(S.opp.toUpperCase(),330,24,700,B);x.fillText(S.opp.toUpperCase(),P+170,y-10);x.font=`700 24px ${B}`;x.fillText("RANGERS",W-P-170,y-10);
  rows.forEach(([l,o,k],i)=>{
    if(i%2===0){x.fillStyle="#e7eef4";x.fillRect(P,y,W-2*P,76)}
    const split=s=>{const m=String(s).match(/^(.*?)<small>(.*)<\/small>$/);return m?[m[1],m[2]]:[String(s),null]};
    [[o,P+170],[k,W-P-170]].forEach(([v,cx])=>{const[main,sub]=split(v);x.fillStyle="#0d1b33";x.font=`700 34px ${D}`;x.fillText(main,cx,sub?y+40:y+50);if(sub){x.fillStyle="#4a5b74";x.font=`600 20px ${B}`;x.fillText(sub,cx,y+66)}});
    x.fillStyle="#4a5b74";x.font=`700 22px ${B}`;x.fillText(l.toUpperCase(),W/2,y+46);y+=76});
  x.textAlign="left";y+=30;
  // goalies
  section("Rangers goaltending");
  const gc=[["SA",560],["GA",650],["SV%",750],["GAA",860],["TOI",970]];
  x.font=`700 22px ${B}`;x.fillStyle="#4a5b74";x.fillText("GOALIE",P,y+10);x.textAlign="center";gc.forEach(([h,cx])=>x.fillText(h,cx,y+10));x.textAlign="left";y+=22;
  goalies.forEach(g=>{x.fillStyle="#0d1b33";const nm=`#${g.n} ${g.name}`;fit(nm,440,28,700,B);x.fillText(nm,P,y+38);
    x.font=`700 30px ${D}`;x.textAlign="center";
    [g.sa,g.ga,svp(g.sa-g.ga,g.sa),g.sec?(g.ga*regMin()*60/g.sec).toFixed(2):"—",fmtT(g.sec)].forEach((v,i)=>x.fillText(v,gc[i][1],y+38));
    x.textAlign="left";x.strokeStyle="#dfe9f1";x.lineWidth=2;x.beginPath();x.moveTo(P,y+56);x.lineTo(W-P,y+56);x.stroke();y+=56});
  y+=38;
  // scoring
  section("Scoring");
  if(!goals.length){x.fillStyle="#4a5b74";x.font=`400 26px ${B}`;x.fillText("No goals scored.",P,y+30);y+=86}
  goals.forEach(e=>{
    const tx=P+130,avail=W-P-tx;
    x.fillStyle="#0d1b33";x.font=`700 28px ${B}`;
    const main=e.s==="K"?`#${e.sc.n} ${e.sc.name}`:S.opp;
    const isG=e===gw,tagW=(e.type!=="EV"?66:0)+(isG?80:0);fit(main,avail-tagW,28,700,B);const tw=x.measureText(main).width;
    x.fillText(main,tx,y+34);
    if(e.type!=="EV"){x.fillStyle=e.type==="PP"?"#f4b223":"#d3212c";x.beginPath();x.roundRect(tx+tw+12,y+10,52,30,6);x.fill();x.fillStyle=e.type==="PP"?"#0d1b33":"#fff";x.font=`800 20px ${B}`;x.fillText(e.type,tx+tw+21,y+32)}
    if(isG){const gx=tx+tw+12+(e.type!=="EV"?64:0);x.fillStyle="#178a4c";x.beginPath();x.roundRect(gx,y+10,68,30,6);x.fill();x.fillStyle="#fff";x.font=`800 20px ${B}`;x.fillText("GWG",gx+9,y+32)}
    x.fillStyle="#4a5b74";x.font=`400 24px ${B}`;
    const sub=e.s==="K"?(e.a1?"Assists: "+[e.a1,e.a2].filter(Boolean).map(a=>"#"+a.n+" "+a.name).join(", "):"Unassisted"):(e.type==="PP"?"Power play goal":e.type==="SH"?"Shorthanded goal":"Even strength");
    const lines=wrap(sub,avail);lines.forEach((ln,i)=>x.fillText(ln,tx,y+66+i*30));
    const h=Math.max(86,58+lines.length*30+12);
    x.fillStyle=e.s==="K"?"#123a7a":"#2b2f37";x.fillRect(P,y+6,8,h-18);
    x.fillStyle="#0d1b33";x.font=`700 30px ${D}`;x.fillText(PER(e.p),P+26,y+34);x.fillStyle="#4a5b74";x.font=`600 26px ${D}`;x.fillText(fmtT(e.t),P+26,y+66);
    y+=h});
  y+=4;
  section("Penalties");
  if(!pens.length){x.fillStyle="#4a5b74";x.font=`400 26px ${B}`;x.fillText("No penalties.",P,y+30);y+=56}
  pens.forEach(e=>{x.fillStyle="#0d1b33";x.font=`700 26px ${D}`;x.fillText(`${PER(e.p)}  ${fmtT(e.t)}`,P,y+34);
    const pt=penText(e);fit(pt,420,26,600,B);const lw=x.measureText(pt).width;const who=e.s==="K"?`#${e.pl.n} ${e.pl.name}`:S.opp;
    x.textAlign="right";x.fillStyle="#4a5b74";x.fillText(pt,W-P,y+34);x.textAlign="left";
    x.fillStyle="#0d1b33";fit(who,W-P-lw-30-(P+190),26,600,B);x.fillText(who,P+190,y+34);y+=56});
  // crop to content and add footer
  const FH=y+30+70;
  const out=document.createElement("canvas");out.width=W;out.height=FH;const o=out.getContext("2d");
  o.drawImage(cv,0,0);
  o.fillStyle="#0b2350";o.fillRect(0,FH-70,W,70);o.fillStyle="#cfe0f5";o.font=`600 22px ${B}`;o.textAlign="center";
  o.fillText(`Periods ${S.lens.join("-")} · Shots include goals${trackerNames(S)?" · Tracked by "+trackerNames(S):""}`,W/2,FH-28,W-60);

}
